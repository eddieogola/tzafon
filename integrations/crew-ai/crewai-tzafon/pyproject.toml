[project]
name = "crewai-tzafon"
version = "1.0.0"
description = "CrewAI tool for loading web pages using Tzafon's headless browser infrastructure"
readme = "README.md"
authors = [
    { name = "Tzafon Team", email = "support@tzafon.ai" }
]
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.1.0",
    "crewai-tools>=0.1.0",
    "tzafon>=2.18.0",
    "playwright>=1.57.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=0.9.9",
]

[project.urls]
Homepage = "https://tzafon.ai"
Documentation = "https://docs.lightcone.ai"
Repository = "https://github.com/tzafon/tzafon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
