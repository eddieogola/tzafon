services:
  tzafon-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MCP_PORT:-5400}:5400"
    environment:
      - NODE_ENV=production
      - MCP_PORT=5400
      # API key is optional for HTTP transport - clients provide via Authorization header
      # Uncomment if you want a default API key:
      # - TZAFON_API_KEY=${TZAFON_API_KEY}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5400/mcp",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
