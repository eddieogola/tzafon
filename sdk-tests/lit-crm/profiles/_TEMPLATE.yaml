# =============================================================================
# lit-crm profile TEMPLATE
# -----------------------------------------------------------------------------
# Copy this file to `profiles/<app>.yaml` and fill it in to ship a new app.
# A profile is the WHOLE spec for an app: no Python needed for a new SaaS target
# (see README "The path to 50 apps"). Validated by `lit_crm.profile.Profile`.
#
#   cp profiles/_TEMPLATE.yaml profiles/acme.yaml
#   # edit base_url + login.success_check + 1-2 capabilities
#   APP=acme uv run lit-crm-login   # one-time interactive login (saves session)
#   APP=acme uv run lit-crm         # serve the capabilities over MCP
#
# Remove these comments in real profiles if you like; they're here to teach.
# =============================================================================

# Slug used everywhere: APP=<app>, profiles/<app>.yaml, the session file name.
# Lower-cased automatically. Should match the file name.
app: example

# Human-readable name shown in login/log output.
display_name: Example App

# The app's authenticated home. Used as the default navigation target for login
# (when login.start_url is omitted) and recorded with the saved session.
base_url: https://app.example.com

# Browser viewport handed to the computer-use model. 1280x720 is a safe default.
display_width: 1280
display_height: 720

# --- Login: the one-time interactive auth flow -------------------------------
# A human logs in + completes 2FA in the live browser; we never type or store
# credentials. We only persist the opaque session id, and ONLY if success_check
# matches the authenticated page.
login:
  # Where to send the browser to start login. Falls back to base_url if omitted.
  start_url: https://app.example.com/login

  # Shown in the terminal before we block on ENTER. Keep it actionable.
  instructions: >
    Log in with your credentials and complete any 2FA in the live browser.
    Wait until the authenticated home page is fully visible, then press ENTER
    in this terminal.

  # How we confirm you're really logged in. See "SuccessCheck variants" below.
  # For login, html_contains a token that ONLY appears once authenticated is
  # the most reliable choice.
  success_check:
    type: html_contains
    value: "Dashboard"

# --- Defaults applied to every capability unless it overrides them -----------
defaults:
  max_steps: 25          # cap on model action-steps per capability run
  step_wait_seconds: 1.0 # pause after each action so the UI can settle

# --- Capabilities: each becomes one MCP tool ---------------------------------
# Add one entry per action you want to expose. Tool name == capability name.
# ("status" is reserved — it's a built-in tool — and names must be unique.)
capabilities:
  # ---- A READ-ONLY capability (safe; no confirmation needed) ----------------
  - name: list_widgets
    description: >
      List widgets visible in the account. Read-only: never clicks into a
      record or mutates anything. Returns a structured JSON list.

    # Typed inputs become the MCP tool's parameters and are interpolated into
    # `instruction_template` via {name}. Types: string | integer | number | boolean.
    params:
      - name: limit
        type: integer
        description: Maximum number of widgets to return.
        required: false
        default: 25

    # Optional: navigate here before running. Omit to act on the current page.
    start_url: https://app.example.com/widgets

    # The instruction handed to the computer-use model. {param} placeholders are
    # filled from `params`. Be explicit about what NOT to do.
    instruction_template: >
      You are on the Widgets list page. Identify up to {limit} widgets. Do NOT
      click into any widget or change anything. When the list is fully visible,
      you are done.

    # Safety rails enforced by the engine, independent of the model's behavior.
    guardrails:
      max_steps: 15                            # tighter cap for this tool
      allowed_domains: ["app.example.com"]     # off-domain navigates are blocked
      forbidden_actions: ["navigate"]          # any of these action types -> blocked
      require_confirmation: false              # read-only: no confirm gate

    # How the engine decides the run succeeded (see variants below).
    success_check:
      type: html_contains
      value: "Widgets"

    # Optional structured extraction performed AFTER the run (tools-off turn).
    # format: json -> the engine json.loads the model's reply (falls back to
    # raw text if it isn't valid JSON). format: text -> the raw string.
    extract:
      prompt: >
        From the visible widgets table, list each widget as JSON:
        [{"name": ..., "status": ..., "created": ...}]. Reply with JSON only.
      format: json

  # ---- A STATE-MUTATING capability (MUST gate on confirmation) --------------
  - name: archive_widget
    description: >
      Archive a widget by name. MUTATES state — requires confirm=true.
    params:
      - name: widget_name
        type: string
        description: Exact name of the widget to archive.
        required: true
      # Convention for mutating tools: a required boolean the caller must set.
      - name: confirm
        type: boolean
        description: Must be true to actually archive the widget.
        required: true
    start_url: https://app.example.com/widgets
    instruction_template: >
      Find the widget named "{widget_name}", open its actions menu, and choose
      "Archive", confirming the dialog. Do not modify any other widget.
    guardrails:
      max_steps: 20
      allowed_domains: ["app.example.com"]
      forbidden_actions: []
      # IMPORTANT: any capability that changes state MUST set this to true so
      # the server refuses to run unless the caller passes confirm=true.
      require_confirmation: true
    success_check:
      type: html_contains
      value: "Widget archived"

# =============================================================================
# SuccessCheck variants (used by login.success_check and capability.success_check)
# -----------------------------------------------------------------------------
#   html_contains   { type: html_contains, value: "<text>" }
#       Pass when <text> appears in the final page HTML. Best general choice.
#
#   html_absent     { type: html_absent, value: "<text>" }
#       Pass when <text> is NOT in the page HTML (e.g. a "Sign in" button is
#       gone, proving you're authenticated; or an error banner never appeared).
#
#   model_terminated { type: model_terminated }
#       Pass when the model finished on its own (stopped issuing actions). Use
#       for open-ended tasks with no single reliable on-page marker.
#
#   answer_matches  { type: answer_matches, pattern: "<regex>" }
#       Pass when the model's final MESSAGE text matches the regex. Pair with an
#       instruction that asks the model to report a specific result.
#
#   url_contains    { type: url_contains, value: "<substring>" }
#       Pass when <substring> is present (best-effort, matched against page
#       content). Handy when success is signalled by a URL change.
#
# Reminder: set guardrails.require_confirmation: true for ANY capability that
# mutates state, and add a required `confirm` boolean param so callers opt in.
# =============================================================================
