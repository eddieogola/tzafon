app: hubspot
display_name: HubSpot
base_url: https://app.hubspot.com
display_width: 1280
display_height: 720

login:
  start_url: https://app.hubspot.com/login
  instructions: >
    Log in with your HubSpot credentials and complete any 2FA in the live
    browser. If prompted, select the correct account. Wait until the left-hand
    navigation sidebar (CRM, Marketing, Sales, ...) is fully visible, then press
    ENTER in this terminal.
  success_check:
    # Best-effort guess: the "Contacts" nav item appears in the HubSpot sidebar
    # only once authenticated. Tune this token at first login if needed.
    type: html_contains
    value: "Contacts"

defaults:
  max_steps: 25
  step_wait_seconds: 1.0

capabilities:
  - name: find_unassigned_leads
    description: >
      Find leads (contacts) that have no owner assigned. Read-only: never opens
      or edits a record. Returns a structured JSON list.
    params:
      - name: limit
        type: integer
        description: Maximum number of unassigned leads to return.
        required: false
        default: 25
    start_url: https://app.hubspot.com/contacts
    instruction_template: >
      You are on the HubSpot Contacts index. Open the filters and add a filter
      where "Contact owner" "is unknown" (i.e. unassigned), applying it so the
      table shows only ownerless contacts. Identify up to {limit} of these
      unassigned leads, reading the Name, Email, Lead Status, and Create Date
      columns. Do NOT click into any contact, change the owner, or edit any
      field. When the filtered list is fully visible, you are done.
    guardrails:
      max_steps: 18
      allowed_domains: ["app.hubspot.com"]
      forbidden_actions: ["navigate"]
      require_confirmation: false
    success_check:
      type: html_contains
      value: "Contacts"
    extract:
      prompt: >
        From the visible filtered contacts table, list each unassigned lead as
        JSON:
        [{"name": ..., "email": ..., "lead_status": ..., "create_date": ...}].
        Reply with JSON only.
      format: json

  - name: assign_lead_to_owner
    description: >
      Assign a single lead (contact) to a HubSpot user by email. MUTATES state
      (sets the contact owner) — requires confirm=true.
    params:
      - name: lead_name
        type: string
        description: Exact name of the lead/contact to assign.
        required: true
      - name: owner_email
        type: string
        description: Email address of the HubSpot user who should own the lead.
        required: true
      - name: confirm
        type: boolean
        description: Must be true to actually perform the change.
        required: true
    start_url: https://app.hubspot.com/contacts
    instruction_template: >
      In the Contacts index, search for the contact named "{lead_name}" and open
      their record. In the left "About this contact" panel, find the "Contact
      owner" property, click it, and select the user whose email is
      "{owner_email}" from the dropdown. Confirm/save the change so the owner is
      updated. Do not edit any other property or contact.
    guardrails:
      max_steps: 25
      allowed_domains: ["app.hubspot.com"]
      forbidden_actions: []
      require_confirmation: true
    success_check:
      type: html_contains
      value: "Contact owner"

  - name: create_deal
    description: >
      Create a new deal in the CRM. MUTATES state (creates a record) — requires
      confirm=true.
    params:
      - name: deal_name
        type: string
        description: Name for the new deal.
        required: true
      - name: amount
        type: number
        description: Deal amount in the account's currency.
        required: true
      - name: pipeline_stage
        type: string
        description: The pipeline stage to place the deal in.
        required: false
        default: "Appointment scheduled"
      - name: confirm
        type: boolean
        description: Must be true to actually perform the change.
        required: true
    start_url: https://app.hubspot.com/contacts/deals
    instruction_template: >
      On the HubSpot Deals page, click "Create deal" to open the create panel.
      Set "Deal name" to "{deal_name}", set "Amount" to {amount}, and set the
      "Deal stage" to "{pipeline_stage}" (leave the default pipeline selected).
      Then click "Create" to save the deal. Do not edit any other deal or field.
    guardrails:
      max_steps: 25
      allowed_domains: ["app.hubspot.com"]
      forbidden_actions: []
      require_confirmation: true
    success_check:
      type: html_contains
      value: "Deal created"
