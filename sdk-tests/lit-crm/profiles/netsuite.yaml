app: netsuite
display_name: Oracle NetSuite
# Generic NetSuite host. NOTE: many orgs are served from an account-specific
# domain like https://<accountid>.app.netsuite.com (e.g. https://1234567.app.netsuite.com).
# If your account redirects there, update base_url and allowed_domains to match.
base_url: https://system.netsuite.com
display_width: 1280
display_height: 720

login:
  start_url: https://system.netsuite.com
  instructions: >
    Log in with your NetSuite credentials and complete any 2FA / security
    questions in the live browser. If prompted, choose the correct role/account.
    Wait until the NetSuite Home dashboard (with the top navigation menu bar) is
    fully visible, then press ENTER in this terminal.
  success_check:
    # Best-effort guess: the global nav exposes a "Transactions" menu only after
    # you are authenticated with a role. Tune at first login if it doesn't match.
    type: html_contains
    value: "Transactions"

defaults:
  max_steps: 25
  step_wait_seconds: 1.0

capabilities:
  - name: find_pending_purchase_orders
    description: >
      Find purchase orders awaiting approval in NetSuite. Read-only: never
      approves, edits, or opens a PO for editing. Returns a structured JSON list
      of pending purchase orders with PO number, vendor, amount, and date.
    params:
      - name: limit
        type: integer
        description: Maximum number of pending purchase orders to return.
        required: false
        default: 25
    start_url: https://system.netsuite.com/app/accounting/transactions/transactionlist.nl?Transaction_TYPE=PurchOrd
    instruction_template: >
      You are on the Transactions > Purchases > Purchase Orders list in NetSuite
      (Transactions menu). Use the list's Status / "View" filter to show purchase
      orders with status "Pending Approval" (also called "Pending Supervisor
      Approval"). Identify up to {limit} pending purchase orders in the table. Do
      NOT open any PO, click Edit, or click Approve. When the filtered pending list
      is fully visible, you are done.
    guardrails:
      max_steps: 15
      allowed_domains: ["system.netsuite.com", "app.netsuite.com"]
      forbidden_actions: ["navigate"]
      require_confirmation: false
    success_check:
      type: html_contains
      value: "Pending Approval"
    extract:
      prompt: >
        From the visible pending purchase-orders list, list each PO as JSON:
        [{"po_number": ..., "vendor": ..., "amount": ..., "date": ...,
        "status": ...}]. Reply with JSON only.
      format: json

  - name: approve_purchase_order
    description: >
      Approve a single pending purchase order by its PO number in NetSuite.
      MUTATES state (approves the PO) — requires confirm=true.
    params:
      - name: po_number
        type: string
        description: The purchase order number to approve (e.g. "PO-1042").
        required: true
      - name: confirm
        type: boolean
        description: Must be true to actually approve the purchase order.
        required: true
    start_url: https://system.netsuite.com/app/accounting/transactions/transactionlist.nl?Transaction_TYPE=PurchOrd
    instruction_template: >
      On the Transactions > Purchases > Purchase Orders list, find the purchase
      order whose number matches "{po_number}". Open it, then use the "Approve"
      button (or Actions > Approve, depending on the approval workflow) to approve
      that PO and save. Approve ONLY the PO matching "{po_number}" — do not edit
      line items, amounts, the vendor, or approve any other purchase order.
    guardrails:
      max_steps: 25
      allowed_domains: ["system.netsuite.com", "app.netsuite.com"]
      forbidden_actions: []
      require_confirmation: true
    success_check:
      type: html_contains
      value: "Approved"
    extract:
      prompt: >
        Report the result of the approval as JSON:
        {"po_number": ..., "approved": true/false, "vendor": ..., "amount": ...}.
        Reply with JSON only.
      format: json
