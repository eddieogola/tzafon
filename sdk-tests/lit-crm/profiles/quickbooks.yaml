app: quickbooks
display_name: QuickBooks Online
base_url: https://qbo.intuit.com
display_width: 1280
display_height: 720

login:
  start_url: https://qbo.intuit.com
  instructions: >
    Log in with your Intuit / QuickBooks Online credentials and complete any 2FA
    in the live browser. Wait until the company dashboard (the "Get things done"
    home with the left navigation menu) is fully visible, then press ENTER in
    this terminal.
  success_check:
    # Best-effort guess: this label appears in the left nav only once you are
    # authenticated into a company file. Tune at first login if it doesn't match.
    type: html_contains
    value: "Bookkeeping"

defaults:
  max_steps: 25
  step_wait_seconds: 1.0

capabilities:
  - name: find_overdue_invoices
    description: >
      Find invoices in QuickBooks Online that are past their due date. Read-only:
      never opens, edits, or sends an invoice. Returns a structured JSON list of
      overdue invoices with customer, amount, due date, and days overdue.
    params:
      - name: limit
        type: integer
        description: Maximum number of overdue invoices to return.
        required: false
        default: 25
    start_url: https://qbo.intuit.com/app/invoices
    instruction_template: >
      You are on the Sales > Invoices page in QuickBooks Online. Use the status
      filter at the top of the invoice list and select "Overdue" so only past-due
      invoices are shown. Identify up to {limit} overdue invoices in the table.
      Do NOT open any invoice, click "Send reminder", or change anything. When the
      filtered overdue list is fully visible, you are done.
    guardrails:
      max_steps: 15
      allowed_domains: ["qbo.intuit.com"]
      forbidden_actions: ["navigate"]
      require_confirmation: false
    success_check:
      type: html_contains
      value: "Overdue"
    extract:
      prompt: >
        From the visible overdue-invoices table, list each overdue invoice as JSON:
        [{"customer": ..., "invoice_no": ..., "amount": ..., "due_date": ...,
        "days_overdue": ...}]. Reply with JSON only.
      format: json

  - name: send_payment_reminders
    description: >
      Send QuickBooks Online's built-in payment reminder email to customers with
      overdue invoices, working through the Overdue-filtered invoice list.
      MUTATES state (sends emails) — requires confirm=true.
    params:
      - name: max_customers
        type: integer
        description: Maximum number of customers to send a reminder to.
        required: false
        default: 10
      - name: confirm
        type: boolean
        description: Must be true to actually send reminder emails.
        required: true
    start_url: https://qbo.intuit.com/app/invoices
    instruction_template: >
      On the Sales > Invoices page, set the status filter to "Overdue". For up to
      {max_customers} of the overdue invoices, open the row's Action dropdown (the
      caret in the rightmost column) and choose "Send reminder", then confirm/Send
      in the reminder dialog. Do NOT edit invoice amounts, due dates, or customer
      details. Stop after sending reminders for {max_customers} customers.
    guardrails:
      max_steps: 40
      allowed_domains: ["qbo.intuit.com"]
      forbidden_actions: []
      require_confirmation: true
    success_check:
      type: html_contains
      value: "reminder"
    extract:
      prompt: >
        How many payment reminders were successfully sent? Reply as JSON:
        {"sent_count": ..., "customers": [...]}.
      format: json

  - name: categorize_uncategorized_expenses
    description: >
      Review uncategorized bank transactions in the Banking / Transactions feed
      and assign each a category (account), then add it to the books. MUTATES
      state (changes/creates expense records) — requires confirm=true.
    params:
      - name: limit
        type: integer
        description: Maximum number of uncategorized transactions to categorize.
        required: false
        default: 20
      - name: confirm
        type: boolean
        description: Must be true to actually categorize and post transactions.
        required: true
    start_url: https://qbo.intuit.com/app/banking
    instruction_template: >
      You are on the Transactions > Bank transactions page in QuickBooks Online.
      Open the "For review" tab. For up to {limit} transactions that show
      "Uncategorized" (or no category), click the row to expand it, pick the most
      appropriate expense Category/account from QuickBooks's suggestion, and click
      "Add" / "Confirm" to post it to the books. Do NOT exclude transactions,
      change amounts, or alter the matched payee. Stop after {limit} transactions.
    guardrails:
      max_steps: 50
      allowed_domains: ["qbo.intuit.com"]
      forbidden_actions: []
      require_confirmation: true
    success_check:
      type: html_contains
      value: "Categorized"
    extract:
      prompt: >
        How many transactions were categorized and posted? Reply as JSON:
        {"categorized_count": ..., "transactions": [{"payee": ..., "amount": ...,
        "category": ...}]}.
      format: json
