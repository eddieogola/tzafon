app: shopify
display_name: Shopify Admin
base_url: https://admin.shopify.com
display_width: 1280
display_height: 720

login:
  start_url: https://admin.shopify.com/store
  instructions: >
    Log in with your Shopify credentials, pick your store, and complete any 2FA
    in the live browser. Wait until the store admin Home is visible, then press
    ENTER in this terminal.
  success_check:
    # Best-effort guess: "Home" + the left-nav appears only once you're in the
    # authenticated admin. Tune this token at your first real login.
    type: html_contains
    value: "Orders"

defaults:
  max_steps: 25
  step_wait_seconds: 1.0

capabilities:
  - name: find_low_stock_products
    description: >
      Find product variants whose available inventory is at or below a
      threshold. Read-only: never opens or edits a product. Returns a
      structured JSON list of low-stock items.
    params:
      - name: threshold
        type: integer
        description: Flag variants with available quantity less than or equal to this number.
        required: false
        default: 5
    start_url: https://admin.shopify.com/store/inventory
    instruction_template: >
      You are on the Shopify admin Inventory page (Products > Inventory). Read
      the "Available" column for each product variant in the table. Identify the
      variants whose available quantity is at or below {threshold}. Sort or scan
      the visible rows but do NOT click into any product, edit quantities, or
      change anything. When the inventory table is fully visible, you are done.
    guardrails:
      max_steps: 15
      allowed_domains: ["admin.shopify.com"]
      forbidden_actions: ["navigate"]
      require_confirmation: false
    success_check:
      type: html_contains
      value: "Available"
    extract:
      prompt: >
        From the visible inventory table, list each variant whose available
        quantity is at or below the threshold as JSON:
        [{"product": ..., "variant": ..., "sku": ..., "available": ...}].
        Reply with JSON only.
      format: json

  - name: fulfill_pending_orders
    description: >
      Mark unfulfilled, paid orders as fulfilled using Shopify's "Fulfill items"
      flow. MUTATES state (fulfills orders, may trigger customer notifications) —
      requires confirm=true.
    params:
      - name: max_orders
        type: integer
        description: Maximum number of orders to fulfill in this run.
        required: false
        default: 10
      - name: confirm
        type: boolean
        description: Must be true to actually fulfill orders.
        required: true
    start_url: https://admin.shopify.com/store/orders?fulfillment_status=unfulfilled&financial_status=paid
    instruction_template: >
      You are on the Shopify admin Orders page filtered to unfulfilled, paid
      orders. For up to {max_orders} orders, open each order, click "Fulfill
      items", leave the quantities as-is, and click "Fulfill items" to confirm.
      Do NOT issue refunds, edit line items, or change prices. Return to the
      Orders list between orders. Stop after fulfilling {max_orders} orders.
    guardrails:
      max_steps: 40
      allowed_domains: ["admin.shopify.com"]
      forbidden_actions: []
      require_confirmation: true
    success_check:
      type: html_contains
      value: "Fulfilled"
    extract:
      prompt: >
        How many orders were successfully fulfilled? Reply as JSON:
        {"fulfilled_count": ..., "orders": [...]}.
      format: json
