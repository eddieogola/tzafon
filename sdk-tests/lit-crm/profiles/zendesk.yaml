app: zendesk
display_name: Zendesk Support
# Set your Zendesk subdomain: replace "your-subdomain" with your account's
# subdomain (e.g. https://acme.zendesk.com). The Agent Workspace lives here.
base_url: https://your-subdomain.zendesk.com
display_width: 1280
display_height: 720

login:
  # Replace "your-subdomain" with your Zendesk subdomain.
  start_url: https://your-subdomain.zendesk.com/agent
  instructions: >
    Log in with your Zendesk agent credentials and complete any 2FA in the live
    browser. Wait until the Agent Workspace (left sidebar with Views, Search) is
    fully visible, then press ENTER in this terminal.
  success_check:
    # Best-effort guess: the Agent Workspace top bar shows "Views". Tune this on
    # first login if it doesn't match the post-auth page.
    type: html_contains
    value: "Views"

defaults:
  max_steps: 25
  step_wait_seconds: 1.0

capabilities:
  - name: find_overdue_tickets
    description: >
      Find Zendesk tickets that are past their SLA target or have not been
      updated recently. Read-only: never opens a ticket or changes anything.
      Returns a structured JSON list.
    params:
      - name: limit
        type: integer
        description: Maximum number of overdue tickets to return.
        required: false
        default: 25
    # Replace "your-subdomain" with your Zendesk subdomain.
    start_url: https://your-subdomain.zendesk.com/agent/filters/overdue
    instruction_template: >
      You are in the Zendesk Agent Workspace on a ticket View showing overdue
      tickets. If a "Overdue" or "Unsolved tickets" view is not already selected,
      pick it from the Views list in the left sidebar and sort by the "Requested"
      or "Updated" column so the most stale tickets are at the top. Identify up to
      {limit} tickets that are past their SLA / not recently updated. Do NOT click
      into any ticket, reassign, or change status. When the list is fully visible,
      you are done.
    guardrails:
      max_steps: 15
      allowed_domains: ["zendesk.com"]
      forbidden_actions: ["navigate"]
      require_confirmation: false
    success_check:
      type: html_contains
      value: "Subject"
    extract:
      prompt: >
        From the visible tickets View table, list each overdue ticket as JSON:
        [{"ticket_id": ..., "subject": ..., "requester": ..., "assignee": ...,
        "status": ..., "updated": ...}]. Reply with JSON only.
      format: json

  - name: reassign_ticket
    description: >
      Reassign a Zendesk ticket to a different agent by their email address.
      MUTATES state (changes the assignee) — requires confirm=true.
    params:
      - name: ticket_id
        type: string
        description: The Zendesk ticket ID or number to reassign (e.g. "12345").
        required: true
      - name: assignee_email
        type: string
        description: Email address of the agent to assign the ticket to.
        required: true
      - name: confirm
        type: boolean
        description: Must be true to actually perform the change.
        required: true
    # Replace "your-subdomain" with your Zendesk subdomain.
    start_url: https://your-subdomain.zendesk.com/agent/tickets/{ticket_id}
    instruction_template: >
      Open Zendesk ticket {ticket_id}. In the ticket's right-hand properties
      panel, click the "Assignee" field, search for the agent with email
      "{assignee_email}", and select them. Then click "Submit" (or
      "Submit as Open") to save the reassignment. Do not change the ticket's
      status, priority, or any other field. Only reassign this single ticket.
    guardrails:
      max_steps: 20
      allowed_domains: ["zendesk.com"]
      forbidden_actions: []
      require_confirmation: true
    success_check:
      type: html_contains
      value: "Assignee"

  - name: close_resolved_tickets
    description: >
      Close (set to Closed) tickets that are already Solved so they are finalized.
      MUTATES state (changes ticket status) — requires confirm=true.
    params:
      - name: max_tickets
        type: integer
        description: Maximum number of solved tickets to close in one run.
        required: false
        default: 10
      - name: confirm
        type: boolean
        description: Must be true to actually perform the change.
        required: true
    # Replace "your-subdomain" with your Zendesk subdomain.
    start_url: https://your-subdomain.zendesk.com/agent/filters/solved
    instruction_template: >
      You are in the Zendesk Agent Workspace on a View of Solved tickets. Select
      the "Solved tickets" view from the left sidebar if it is not already shown.
      For up to {max_tickets} solved tickets, tick each ticket's checkbox to
      select them, then use the bulk "Edit" / "Apply macro" toolbar to set the
      Status to "Closed" and click "Submit" to apply. Do not modify any other
      field. Stop after closing {max_tickets} tickets.
    guardrails:
      max_steps: 35
      allowed_domains: ["zendesk.com"]
      forbidden_actions: []
      require_confirmation: true
    success_check:
      type: html_contains
      value: "Closed"
    extract:
      prompt: >
        How many solved tickets were successfully closed? Reply as JSON:
        {"closed_count": ..., "ticket_ids": [...]}.
      format: json
