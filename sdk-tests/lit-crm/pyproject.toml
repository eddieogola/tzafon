[project]
name = "lit-crm"
version = "0.1.0"
description = "One configurable Lightcone MCP server that ACTS on SaaS web UIs via per-app profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2.0",
    "tzafon>=2.40.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.scripts]
lit-crm = "lit_crm.server:main"
lit-crm-login = "lit_crm.login:login_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lit_crm"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the real Tzafon API; skipped without TZAFON_API_KEY",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]
